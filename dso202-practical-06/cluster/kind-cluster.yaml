# =============================================================================
# File        : cluster/kind-cluster.yaml
# Practical   : DSO202 Practical 6 (Helm)
# Purpose     : Three-node cluster (1 control-plane, 2 workers) with host port
#               30080 published, so the dev release's NodePort can be reached
#               with curl http://localhost:30080
# Apply with  : kind create cluster --config cluster/kind-cluster.yaml
# Delete with : kind delete cluster --name dso202-p6
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Cluster name decides the kubectl context: kind-dso202-p6
name: dso202-p6

networking:
  apiServerAddress: "127.0.0.1"

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane
    # Publish NodePort 30080 to the host (loopback only).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2