# =============================================================================
# File        : manifests/05-service-nodeport.yaml
# Apply with  : kubectl apply -f manifests/05-service-nodeport.yaml
# Verify with : curl -s http://localhost:30080
# DEPENDS ON LISTING 1: nodePort must equal Listing 1's extraPortMappings port
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: dso202-practical-01
  labels:
    app: web
    tier: frontend
    dso202/practical: "01"
    dso202/managed-by: declarative
spec:
  type: NodePort
  selector:
    app: web
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP