# =============================================================================
# File        : manifests/04-service-clusterip.yaml
# Apply with  : kubectl apply -f manifests/04-service-clusterip.yaml
# DNS NAME    : web-clusterip.dso202-practical-01.svc.cluster.local
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: dso202-practical-01
  labels:
    app: web
    tier: frontend
    dso202/practical: "01"
    dso202/managed-by: declarative
spec:
  type: ClusterIP
  selector:
    app: web
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  sessionAffinity: None