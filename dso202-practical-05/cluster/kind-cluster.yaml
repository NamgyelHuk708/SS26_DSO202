# =============================================================================
# File        : cluster/kind-cluster.yaml
# Practical   : DSO202 Practical 5 (Kustomize)
# Purpose     : Three-node cluster matching the lab topology: one control-plane
#               and two workers. Same node names as Practicals 1 and 2.
# Apply with  : kind create cluster --config cluster/kind-cluster.yaml
# Delete with : kind delete cluster --name dso202-p5
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Cluster name decides the kubectl context: kind-dso202-p5
name: dso202-p5

networking:
  apiServerAddress: "127.0.0.1"

nodes:
  # The 'image:' lines from Practicals 1 and 2 are omitted on purpose, so kind
  # uses its own default node image and there is no digest to mistype.
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1

  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2