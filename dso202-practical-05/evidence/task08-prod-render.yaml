apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: prod
    dso202/managed-by: declarative
    dso202/practical: "05"
  name: webapp-prod
---
apiVersion: v1
data:
  index.html: |
    <!-- File: examples/webapp/overlays/prod/index.html -->
    <!DOCTYPE html>
    <html>
      <head><title>webapp prod</title></head>
      <body>
        <h1>PROD — production environment</h1>
      </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: prod
  name: web-content-5ch65222dd
  namespace: webapp-prod
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
    dso202/managed-by: declarative
    dso202/practical: "05"
  name: webapp
  namespace: webapp-prod
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    dso202.cst.edu.bt/description: Shared webapp Deployment (base)
  labels:
    app.kubernetes.io/environment: prod
    app.kubernetes.io/name: webapp
    dso202/managed-by: declarative
    dso202/practical: "05"
  name: webapp
  namespace: webapp-prod
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: prod
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.30-alpine
        imagePullPolicy: IfNotPresent
        name: webapp
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
      volumes:
      - configMap:
          name: web-content-5ch65222dd
        name: web-content
