apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/environment: qa
    dso202/managed-by: declarative
    dso202/practical: "05"
  name: webapp-qa
---
apiVersion: v1
data:
  index.html: |
    <!-- File: examples/webapp/overlays/qa/index.html -->
    <!DOCTYPE html>
    <html>
      <head><title>webapp qa</title></head>
      <body>
        <h1>QA — quality assurance environment (owner: qa-team)</h1>
      </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/environment: qa
  name: web-content-4945b59gh5
  namespace: webapp-qa
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/environment: qa
    app.kubernetes.io/name: webapp
    dso202/managed-by: declarative
    dso202/practical: "05"
  name: webapp
  namespace: webapp-qa
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    dso202.cst.edu.bt/description: Shared webapp Deployment (base)
    training.example.com/owner: qa-team
  labels:
    app.kubernetes.io/environment: qa
    app.kubernetes.io/name: webapp
    dso202/managed-by: declarative
    dso202/practical: "05"
  name: webapp
  namespace: webapp-qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: qa
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.30-alpine
        imagePullPolicy: IfNotPresent
        name: webapp
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
      volumes:
      - configMap:
          name: web-content-4945b59gh5
        name: web-content
