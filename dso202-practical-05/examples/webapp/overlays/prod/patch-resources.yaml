# =============================================================================
# File        : examples/webapp/overlays/prod/patch-resources.yaml
# Purpose     : Production resource policy. A strategic merge patch: it looks
#               like a Kubernetes fragment and is MERGED into the base
#               Deployment. The container is matched by its name, 'webapp'.
#               Fields not written here (image, probe, ports, mounts) stay.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  template:
    spec:
      containers:
        - name: webapp
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi