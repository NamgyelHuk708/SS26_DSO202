# Sized for ONE replica per tier (dev). Workload totals:
#   requests: cpu 250m, memory 320Mi   limits: cpu 1000m, memory 896Mi
# Headroom covers a rolling-update surge Pod and short-lived test Pods.
# The prod overlay raises these for its extra replicas.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-tracker-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    persistentvolumeclaims: "2"
    count/services: "5"
    count/configmaps: "10"
    count/secrets: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: task-tracker-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 1Gi
