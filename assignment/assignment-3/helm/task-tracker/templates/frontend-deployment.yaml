{{- /* frontend-deployment.yaml - nginx static site, image runs unmodified. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.frontendName" . }}
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" (dict "ctx" . "component" "frontend") | nindent 8 }}
      annotations:
        {{- include "task-tracker.configChecksums" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: frontend
          image: {{ include "task-tracker.image" (dict "ctx" . "img" .Values.images.frontend) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "task-tracker.configName" . }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
