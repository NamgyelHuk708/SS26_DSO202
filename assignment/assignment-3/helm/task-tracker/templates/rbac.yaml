{{- if .Values.rbac.create }}
{{- /* rbac.yaml - read-only viewer for this release's namespace (A1 Task 8). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-tracker.fullname" . }}-viewer
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "rbac") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "task-tracker.fullname" . }}-viewer
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "rbac") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "task-tracker.fullname" . }}-viewer
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "rbac") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "task-tracker.fullname" . }}-viewer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "task-tracker.fullname" . }}-viewer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
