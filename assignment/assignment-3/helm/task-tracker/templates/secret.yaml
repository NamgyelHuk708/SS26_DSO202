{{- /*
secret.yaml - database credentials. "required" refuses to render without
them. Reminder: Helm stores every supplied value in its release record, so
`helm get values` can still reveal this password to anyone who can read
Secrets in the namespace.
*/}}
{{- $user := required "database.user must be set: pass -f environments/secrets-<env>.yaml" .Values.database.user }}
{{- $pass := required "database.password must be set: pass -f environments/secrets-<env>.yaml" .Values.database.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-tracker.secretName" . }}
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "config") | nindent 4 }}
type: Opaque
data:
  # DB_* is read by the backend, POSTGRES_* by the Postgres image.
  DB_USER: {{ $user | b64enc | quote }}
  DB_PASSWORD: {{ $pass | b64enc | quote }}
  POSTGRES_USER: {{ $user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $pass | b64enc | quote }}
