{{- if .Values.quota.enabled }}
{{- /* quota.yaml - namespace limits, sized per environment in environments/*.yaml. */}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "task-tracker.fullname" . }}-quota
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "quota") | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.quota.hard | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "task-tracker.fullname" . }}-limits
  labels:
    {{- include "task-tracker.labels" (dict "ctx" . "component" "quota") | nindent 4 }}
spec:
  limits:
    - type: Container
      default:        { cpu: 200m, memory: 128Mi }
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      min:            { cpu: 10m,  memory: 16Mi }
      max:            { cpu: "1",  memory: 1Gi }
{{- end }}
