# Chart.yaml - identity and metadata of the Task Tracker chart.
apiVersion: v2                    # chart format for Helm 3 and Helm 4
name: task-tracker                # must match the directory name
description: >-
  DSO202 three-tier Task Tracker (nginx frontend, Node.js backend, PostgreSQL
  StatefulSet) exposed through an NGINX Ingress. Packages Assignment 2.
type: application
version: 0.1.0                    # version of the CHART; bump on any chart change
appVersion: "1.0"                 # version of the APPLICATION images; quoted so YAML keeps it a string
kubeVersion: ">=1.30.0-0"         # -0 also accepts pre-release cluster builds
keywords: [dso202, task-tracker, statefulset, ingress]
maintainers:
  - name: Namgyel Huk
