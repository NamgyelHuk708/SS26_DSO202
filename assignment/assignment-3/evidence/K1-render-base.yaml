apiVersion: v1
kind: ResourceQuota
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: task-tracker-quota
spec:
  hard:
    count/configmaps: "10"
    count/secrets: "10"
    count/services: "5"
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "2"
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: readonly-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: namespace-viewer
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - configmaps
  - secrets
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: readonly-viewer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-viewer
subjects:
- kind: ServiceAccount
  name: readonly-viewer
---
apiVersion: v1
data:
  APP_PORT: "8080"
  BACKEND_URL: .
  CORS_ORIGIN: '*'
  DB_HOST: db-svc
  DB_NAME: tasksdb
  DB_PORT: "5432"
  POSTGRES_DB: tasksdb
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: app-config-49t4mbfkc4
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: backend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
    tier: backend
  name: backend-svc
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: backend
    tier: backend
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: database
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
    tier: database
  name: db-svc
spec:
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
  selector:
    app: database
    tier: database
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
    tier: frontend
  name: frontend-svc
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: frontend
    tier: frontend
  type: ClusterIP
---
apiVersion: v1
kind: LimitRange
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: task-tracker-limits
spec:
  limits:
  - default:
      cpu: 200m
      memory: 128Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    max:
      cpu: "1"
      memory: 1Gi
    min:
      cpu: 10m
      memory: 16Mi
    type: Container
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
    tier: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
      tier: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: task-tracker
        tier: backend
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: app-config-49t4mbfkc4
        - secretRef:
            name: app-secret
        image: sarojsanyasi/dso202-backend:1.0
        imagePullPolicy: Never
        name: backend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /api/status
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
    tier: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: task-tracker
        tier: frontend
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: app-config-49t4mbfkc4
        image: sarojsanyasi/dso202-frontend:1.0
        imagePullPolicy: Never
        name: frontend
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: database
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
    tier: database
  name: db
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app: database
      tier: database
  serviceName: db-svc
  template:
    metadata:
      labels:
        app: database
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: task-tracker
        tier: database
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: app-config-49t4mbfkc4
        - secretRef:
            name: app-secret
        image: sarojsanyasi/dso202-db:1.0
        imagePullPolicy: Never
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          failureThreshold: 5
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        name: db
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
  volumeClaimTemplates:
  - metadata:
      labels:
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/part-of: task-tracker
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: task-tracker
  name: task-tracker
spec:
  ingressClassName: nginx
  rules:
  - host: tasks.local
    http:
      paths:
      - backend:
          service:
            name: backend-svc
            port:
              name: http
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: frontend-svc
            port:
              name: http
        path: /
        pathType: Prefix
