# Source: task-tracker/templates/db-statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: task-tracker-dev-db
  labels:
    helm.sh/chart: task-tracker-0.1.0
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/instance: task-tracker-dev
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/environment: "dev"
spec:
  serviceName: task-tracker-dev-db
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: task-tracker
      app.kubernetes.io/instance: task-tracker-dev
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        helm.sh/chart: task-tracker-0.1.0
        app.kubernetes.io/name: task-tracker
        app.kubernetes.io/instance: task-tracker-dev
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: task-tracker
        app.kubernetes.io/environment: "dev"
      annotations:
        checksum/config: e2dffa85dbc56bb78bbb0064ac23f9305b63f477d078cda634773e5c37768ed9
        checksum/secret: 97d897aaaf2a595e863d4bef21bb17948da5f579c988f5a9ccba024de83ac010
    spec:
      containers:
        - name: db
          image: "sarojsanyasi/dso202-db:1.0"
          imagePullPolicy: Never
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: task-tracker-dev-config
            - secretRef:
                name: task-tracker-dev-secret
          # Generous timings: Postgres runs under arm64 emulation.
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
  # PVCs created from this template are owned by the StatefulSet controller,
  # NOT by Helm: `helm uninstall` leaves them (and the data) behind.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

