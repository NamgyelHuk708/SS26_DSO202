# Source: task-tracker/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: task-tracker-dev-test
  labels:
    helm.sh/chart: task-tracker-0.1.0
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/instance: task-tracker-dev
    app.kubernetes.io/component: test
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/environment: "dev"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.37
      imagePullPolicy: IfNotPresent
      # Block scalar (|) so the ": " inside the script is not read as YAML.
      command:
        - sh
        - -c
        - |
          set -e
          echo "1) backend Service -> /api/status"
          wget -qO- http://task-tracker-dev-backend:8080/api/status | tee /dev/stderr | grep -q '"db":"connected"'
          echo; echo "2) frontend Service -> /"
          wget -qO- http://task-tracker-dev-frontend:8080/ | grep -qi '<html'
          echo "frontend OK"
          echo "3) Ingress (helm-dev.tasks.local) -> /api/tasks"
          wget -qO- --header "Host: helm-dev.tasks.local" http://ingress-nginx-controller.ingress-nginx.svc/api/tasks | grep -q '"title"'
          echo "ingress OK"
          echo "ALL TESTS PASSED"
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 50m, memory: 32Mi }

