# Source: task-tracker/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-tracker-dev
  labels:
    helm.sh/chart: task-tracker-0.1.0
    app.kubernetes.io/name: task-tracker
    app.kubernetes.io/instance: task-tracker-dev
    app.kubernetes.io/component: ingress
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: task-tracker
    app.kubernetes.io/environment: "dev"
spec:
  ingressClassName: nginx
  rules:
    - host: "helm-dev.tasks.local"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: task-tracker-dev-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-tracker-dev-frontend
                port:
                  name: http
