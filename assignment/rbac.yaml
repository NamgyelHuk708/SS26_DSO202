apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-viewer
  namespace: dso202-assignment-01
  labels:
    dso202/assignment: "01"
    dso202/managed-by: declarative
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-viewer
  namespace: dso202-assignment-01
  labels:
    dso202/assignment: "01"
    dso202/managed-by: declarative
rules:
  # Empty string "" is the "core" API group - Pods, Services, ConfigMaps,
  # Secrets, PVCs all live here.
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  # Deployments live in the "apps" API group, not the core group - a
  # separate rule is required to cover them.
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-viewer-binding
  namespace: dso202-assignment-01
  labels:
    dso202/assignment: "01"
    dso202/managed-by: declarative
subjects:
  - kind: ServiceAccount
    name: readonly-viewer
    namespace: dso202-assignment-01
roleRef:
  kind: Role
  name: namespace-viewer
  apiGroup: rbac.authorization.k8s.io
